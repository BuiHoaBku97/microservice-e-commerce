spring:
  application:
    name: catalog-service
  profiles:
    default: local
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${CATALOG_DB_USERNAME:catalog_user}
    password: ${CATALOG_DB_PASSWORD:catalog_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082
