spring:
  application: {name: catalog-service}
  profiles: {default: local}
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5433/catalog_db}
    username: ${CATALOG_DB_USERNAME:catalog_user}
    password: ${CATALOG_DB_PASSWORD:catalog_password}
  jpa:
    hibernate: {ddl-auto: validate}
    open-in-view: false
  flyway: {enabled: true, locations: classpath:db/migration}
  data:
    redis: {host: "${SPRING_DATA_REDIS_HOST:localhost}", port: "${SPRING_DATA_REDIS_PORT:6379}"}
  security:
    jwt:
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
security:
  service-jwt:
    public-key-base64: ${SERVICE_JWT_PUBLIC_KEY_BASE64}
    private-key-base64: ${SERVICE_JWT_PRIVATE_KEY_BASE64}
    issuer: ${SERVICE_JWT_ISSUER:ecommerce-internal}
    key-id: ${SERVICE_JWT_KEY_ID:service-key-1}
  active-account:
    identity-url: ${IDENTITY_INTERNAL_URL:http://localhost:8081}
eureka:
  client:
    service-url: {defaultZone: "${EUREKA_URI:http://localhost:8761/eureka/}"}
server: {port: 8082}
app:
  catalog:
    default-image-url: ${CATALOG_DEFAULT_IMAGE_URL:https://res.cloudinary.com/demo/image/upload/product-placeholder.jpg}
    cache-ttl-seconds: ${CATALOG_CACHE_TTL_SECONDS:300}
    index-delay-ms: ${CATALOG_INDEX_DELAY_MS:3000}
    reindex-delay-ms: ${CATALOG_REINDEX_DELAY_MS:2000}
