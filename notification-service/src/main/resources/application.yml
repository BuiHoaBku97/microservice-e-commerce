spring:
  application:
    name: notification-service
  profiles:
    default: local
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:notification_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: true
  security:
    jwt:
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}

server:
  port: 8085

app:
  kafka:
    topics:
      order-events: ${ORDER_EVENTS_TOPIC:ecommerce.order.events}
      payment-events: ${PAYMENT_EVENTS_TOPIC:ecommerce.payment.events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
