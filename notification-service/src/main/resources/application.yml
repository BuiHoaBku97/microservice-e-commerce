spring:
  application:
    name: notification-service
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}"
  profiles:
    default: local
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:notification_user}
    password: ${NOTIFICATION_DB_PASSWORD:notification_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_KAFKA_GROUP_ID:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
      observation-enabled: true
    producer:
      observation-enabled: true
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    jwt:
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

server:
  port: 8085

management:
  endpoints.web.exposure.include: health,prometheus
  tracing:
    sampling.probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}
logging.structured.format.console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

app:
  service-jwt:
    private-key-base64: ${SERVICE_JWT_PRIVATE_KEY_BASE64}
    issuer: ${SERVICE_JWT_ISSUER:ecommerce-internal}
    key-id: ${SERVICE_JWT_KEY_ID:notification-service-key-1}
  active-account:
    identity-url: ${IDENTITY_INTERNAL_URL:http://localhost:8081}
  notification:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
    retry-seconds: ${NOTIFICATION_RETRY_SECONDS:30}
    delivery-delay-ms: ${NOTIFICATION_DELIVERY_DELAY_MS:5000}
  kafka:
    topics:
      order-events: ${ORDER_EVENTS_TOPIC:ecommerce.order.events}
      payment-events: ${PAYMENT_EVENTS_TOPIC:ecommerce.payment.events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
