openapi: 3.1.0
info:
  title: E-commerce microservices API
  version: 1.0.0
  description: Public gateway REST API and private service-to-service contracts.
servers:
- url: http://localhost:8080
  description: Local gateway (public APIs only)
components:
  securitySchemes:
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceJwt:
      type: apiKey
      in: header
      name: X-Service-Authorization
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
  responses:
    BadRequest:
      description: Validation or malformed request
      content: &id001
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: Authentication failed
      content: *id001
    Forbidden:
      description: Caller is not allowed
      content: *id001
    NotFound:
      description: Resource not found or not owned by caller
      content: *id001
    Conflict:
      description: Version, state, stock, price, or idempotency conflict
      content: *id001
  schemas:
    ApiResponse:
      type: object
      required:
      - code
      - message
      - data
      - requestId
      properties:
        code:
          type: string
          const: SUCCESS
        message:
          type: string
        data: {}
        requestId:
          type: string
    ApiError:
      type: object
      required:
      - code
      - message
      - errors
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        errors:
          type: array
          items:
            type: string
        requestId:
          type: string
    PageData:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    GenericObject:
      type: object
      additionalProperties: true
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - fullName
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
        fullName:
          type: string
          maxLength: 150
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    UpdateProfileRequest:
      type: object
      required:
      - version
      properties:
        fullName:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        version:
          type: integer
          format: int64
    AddressRequest:
      type: object
      required:
      - recipientName
      - recipientPhone
      - addressLine
      - ward
      - province
      properties:
        recipientName:
          type: string
        recipientPhone:
          type: string
        addressLine:
          type: string
        ward:
          type: string
        district:
          type: string
        province:
          type: string
        defaultAddress:
          type: boolean
    ChangeUserStatusRequest:
      type: object
      required:
      - version
      properties:
        reason:
          type: string
        version:
          type: integer
          format: int64
    VersionRequest:
      type: object
      required:
      - version
      properties:
        version:
          type: integer
          format: int64
    VersionedStatusRequest:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
        version:
          type: integer
          format: int64
    CartItemRequest:
      type: object
      required:
      - skuId
      - quantity
      properties:
        skuId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        displayedUnitPrice:
          type: integer
          format: int64
    CheckoutRequest:
      type: object
      required:
      - cartVersion
      - addressId
      - paymentMethod
      - expectedItems
      properties:
        cartVersion:
          type: integer
          format: int64
        addressId:
          type: integer
          format: int64
        paymentMethod:
          type: string
          enum:
          - MOCK_ONLINE
        customerNote:
          type: string
          maxLength: 1000
        expectedItems:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExpectedItem'
    ExpectedItem:
      type: object
      required:
      - skuId
      - quantity
      - expectedUnitPrice
      properties:
        skuId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        expectedUnitPrice:
          type: integer
          format: int64
          minimum: 1
    InventoryReceiptRequest:
      type: object
      required:
      - quantity
      - reason
      properties:
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 200
    InventoryAdjustmentRequest:
      type: object
      required:
      - quantity
      - reason
      - version
      properties:
        quantity:
          type: integer
          not:
            const: 0
        reason:
          type: string
          maxLength: 200
        version:
          type: integer
          format: int64
    PaymentSimulationRequest:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          enum:
          - SUCCESS
          - FAILED
    PaymentCallbackRequest:
      type: object
      required:
      - providerEventId
      - providerTransactionId
      - paymentId
      - orderId
      - result
      - amount
      - currency
      properties:
        providerEventId:
          type: string
        providerTransactionId:
          type: string
        paymentId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        result:
          type: string
          enum:
          - SUCCESS
          - FAILED
        amount:
          type: integer
          format: int64
        currency:
          type: string
        paidAt:
          type: string
          format: date-time
    CheckoutContextRequest:
      type: object
      required:
      - addressId
      properties:
        addressId:
          type: integer
          format: int64
    CheckoutItemsRequest:
      type: object
      required:
      - skuIds
      properties:
        skuIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: integer
            format: int64
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register customer
      tags:
      - Identity
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security: &id002 []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Login
      tags:
      - Identity
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate refresh token
      tags:
      - Identity
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke refresh session
      tags:
      - Identity
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      summary: Get current profile
      tags:
      - Identity
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security: &id003
      - userJwt: []
    patch:
      operationId: updateCurrentUser
      summary: Update current profile
      tags:
      - Identity
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
