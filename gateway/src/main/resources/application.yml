spring:
  application:
    name: gateway

  security:
    jwt:
      private-key-base64: 
      public-key-base64: 

  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/admin/categories/**,/api/v1/admin/products/**,/api/v1/admin/skus/**
        - id: payment-by-order
          uri: lb://payment-service
          order: -10
          predicates:
            - Path=/api/v1/orders/{orderId}/payment
            - Method=GET
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/inventory/**,/api/v1/admin/orders/**,/api/v1/admin/inventory/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/admin/payments/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/admin/notifications/**
        - id: unmatched-route
          uri: no://op
          predicates:
            - Path=/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

server:
  port: 8080
