spring:
  application: {name: gateway}
  security:
    jwt:
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  data:
    redis: {host: "${SPRING_DATA_REDIS_HOST:localhost}", port: "${SPRING_DATA_REDIS_PORT:6379}"}
  cloud:
    gateway:
      routes:
        - {id: identity-service, uri: "lb://identity-service", predicates: ["Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**"]}
        - {id: catalog-service, uri: "lb://catalog-service", predicates: ["Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/admin/categories/**,/api/v1/admin/products/**,/api/v1/admin/skus/**,/api/v1/admin/catalog/**"]}
        - {id: payment-by-order, uri: "lb://payment-service", order: -10, predicates: ["Path=/api/v1/orders/{orderId}/payment", "Method=GET"]}
        - {id: payment-initialize, uri: "lb://payment-service", order: -9, predicates: ["Path=/api/v1/orders/{orderId}/payment/initialize", "Method=POST"]}
        - {id: payment-vnpay-callback, uri: "lb://payment-service", order: -8, predicates: ["Path=/api/v1/payments/vnpay/**", "Method=GET"]}
        - {id: order-service, uri: "lb://order-service", predicates: ["Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/inventory/**,/api/v1/admin/orders/**,/api/v1/admin/inventory/**,/api/v1/admin/reports/orders"]}
        - {id: payment-service, uri: "lb://payment-service", predicates: ["Path=/api/v1/payments/**,/api/v1/admin/payments/**,/api/v1/admin/reports/payments,/api/v1/admin/demo/payments/**"]}
        - {id: notification-service, uri: "lb://notification-service", predicates: ["Path=/api/v1/notifications/**,/api/v1/admin/notifications/**"]}
        - {id: unmatched-route, uri: "no://op", predicates: ["Path=/**"]}
eureka:
  client:
    service-url: {defaultZone: "${EUREKA_URI:http://localhost:8761/eureka/}"}
server: {port: 8080}
management:
  endpoints.web.exposure.include: health,prometheus
  tracing:
    sampling.probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}
logging.structured.format.console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}
app:
  rate-limit:
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    public-per-window: ${RATE_LIMIT_PUBLIC:120}
    authenticated-per-window: ${RATE_LIMIT_AUTHENTICATED:240}
    login-per-window: ${RATE_LIMIT_LOGIN:10}
    checkout-per-window: ${RATE_LIMIT_CHECKOUT:30}
