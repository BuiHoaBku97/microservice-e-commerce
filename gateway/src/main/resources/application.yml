spring:
  application:
    name: gateway

  security:
    jwt:
      private-key-base64: 
      public-key-base64: 

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users/**
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/categories/**,/api/v1/products/**,/api/v1/admin/categories/**,/api/v1/admin/products/**,/api/v1/admin/skus/**
        - id: payment-by-order
          uri: lb://payment-service
          order: -10
          predicates:
            - Path=/api/v1/orders/{orderId}/payment
            - Method=GET
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/inventory/**,/api/v1/admin/orders/**,/api/v1/admin/inventory/**,/api/v1/admin/reports/orders
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**,/api/v1/admin/payments/**,/api/v1/admin/reports/payments
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/admin/notifications/**
        - id: unmatched-route
          uri: no://op
          predicates:
            - Path=/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

server:
  port: 8080

app:
  rate-limit:
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    public-per-window: ${RATE_LIMIT_PUBLIC:120}
    authenticated-per-window: ${RATE_LIMIT_AUTHENTICATED:240}
    login-per-window: ${RATE_LIMIT_LOGIN:10}
    checkout-per-window: ${RATE_LIMIT_CHECKOUT:30}
