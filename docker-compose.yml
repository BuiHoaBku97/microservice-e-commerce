services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1;
        do sleep 2; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.order.events --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.payment.events --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.order.events.payment-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.order.events.notification-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.payment.events.order-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.payment.events.notification-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic springCloudBus --partitions 3 --replication-factor 1

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.18.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8888
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:?CONFIG_GIT_URI must be set}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      CONFIG_GIT_PASSWORD: ${CONFIG_GIT_PASSWORD:-}
      CONFIG_GIT_LABEL: ${CONFIG_GIT_LABEL:-main}
      CONFIG_GIT_CLONE_ON_START: ${CONFIG_GIT_CLONE_ON_START:-true}
      CONFIG_GIT_REFRESH_RATE: ${CONFIG_GIT_REFRESH_RATE:-0}
      CONFIG_GIT_FORCE_PULL: ${CONFIG_GIT_FORCE_PULL:-true}
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8888:8888"
    depends_on:
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8761
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?JWT_PRIVATE_KEY_BASE64 must be set}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PUBLIC_KEYS: "${IDENTITY_SERVICE_JWT_PUBLIC_KEYS:-order-service-key-1=${ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64:?ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set};catalog-service-key-1=${CATALOG_SERVICE_JWT_PUBLIC_KEY_BASE64:?CATALOG_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set};payment-service-key-1=${PAYMENT_SERVICE_JWT_PUBLIC_KEY_BASE64:?PAYMENT_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set};notification-service-key-1=${NOTIFICATION_SERVICE_JWT_PUBLIC_KEY_BASE64:?NOTIFICATION_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set}}"
      SERVICE_JWT_KEY_OWNERS: "${IDENTITY_SERVICE_JWT_KEY_OWNERS:-order-service-key-1=order-service;catalog-service-key-1=catalog-service;payment-service-key-1=payment-service;notification-service-key-1=notification-service}"
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      EUREKA_URI: http://eureka-server:8761/eureka/
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DB_USERNAME: identity_user
      IDENTITY_DB_PASSWORD: identity_password
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PUBLIC_KEYS: "${CATALOG_SERVICE_JWT_PUBLIC_KEYS:-order-service-key-1=${ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64:?ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set}}"
      SERVICE_JWT_KEY_OWNERS: "${CATALOG_SERVICE_JWT_KEY_OWNERS:-order-service-key-1=order-service}"
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${CATALOG_SERVICE_JWT_PRIVATE_KEY_BASE64:?CATALOG_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${CATALOG_SERVICE_JWT_KEY_ID:-catalog-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      EUREKA_URI: http://eureka-server:8761/eureka/
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DB_USERNAME: catalog_user
      CATALOG_DB_PASSWORD: catalog_password
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 75s
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8083
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${ORDER_SERVICE_JWT_PRIVATE_KEY_BASE64:?ORDER_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${ORDER_SERVICE_JWT_KEY_ID:-order-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      EUREKA_URI: http://eureka-server:8761/eureka/
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      ORDER_DB_USERNAME: order_user
      ORDER_DB_PASSWORD: order_password
      ORDER_SHIPPING_FEE: ${ORDER_SHIPPING_FEE:-30000}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 75s
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      EUREKA_URI: http://eureka-server:8761/eureka/
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_DB_USERNAME: payment_user
      PAYMENT_DB_PASSWORD: payment_password
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET must be set}
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
      VNPAY_FRONTEND_RESULT_URL: ${VNPAY_FRONTEND_RESULT_URL:-}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${PAYMENT_SERVICE_JWT_PRIVATE_KEY_BASE64:?PAYMENT_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${PAYMENT_SERVICE_JWT_KEY_ID:-payment-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 75s
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8085
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      EUREKA_URI: http://eureka-server:8761/eureka/
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification_user
      NOTIFICATION_DB_PASSWORD: notification_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${NOTIFICATION_SERVICE_JWT_PRIVATE_KEY_BASE64:?NOTIFICATION_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${NOTIFICATION_SERVICE_JWT_KEY_ID:-notification-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 75s
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-120}
      RATE_LIMIT_AUTHENTICATED: ${RATE_LIMIT_AUTHENTICATED:-240}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_CHECKOUT: ${RATE_LIMIT_CHECKOUT:-30}
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
      cadvisor:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  loki:
    image: grafana/loki:3.5.2
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./docker/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.8.3
    command: run /etc/alloy/config.alloy
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/jaeger:2.8.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger-data:/var/lib/jaeger

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./docker/observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - jaeger
  vnpay-tunnel:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "npx --yes localtunnel
      --local-host gateway
      --port 8080
      --subdomain six-spiders-play"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  elasticsearch-data:
  prometheus-data:
  loki-data:
  jaeger-data:
  grafana-data:
