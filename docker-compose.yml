services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -e;
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1;
        do sleep 2; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.order.events --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.payment.events --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.order.events.payment-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.order.events.notification-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.payment.events.order-service.dlt --partitions 3 --replication-factor 1
        ; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic ecommerce.payment.events.notification-service.dlt --partitions 3 --replication-factor 1

  redis:
    image: redis:7.4.1
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8761
    ports:
      - "8761:8761"

  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:?JWT_PRIVATE_KEY_BASE64 must be set}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PUBLIC_KEYS: "${IDENTITY_SERVICE_JWT_PUBLIC_KEYS:-order-service-key-1=${ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64:?ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set};catalog-service-key-1=${CATALOG_SERVICE_JWT_PUBLIC_KEY_BASE64:?CATALOG_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set};payment-service-key-1=${PAYMENT_SERVICE_JWT_PUBLIC_KEY_BASE64:?PAYMENT_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set};notification-service-key-1=${NOTIFICATION_SERVICE_JWT_PUBLIC_KEY_BASE64:?NOTIFICATION_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set}}"
      SERVICE_JWT_KEY_OWNERS: "${IDENTITY_SERVICE_JWT_KEY_OWNERS:-order-service-key-1=order-service;catalog-service-key-1=catalog-service;payment-service-key-1=payment-service;notification-service-key-1=notification-service}"
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      EUREKA_URI: http://eureka-server:8761/eureka/
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DB_USERNAME: identity_user
      IDENTITY_DB_PASSWORD: identity_password
    depends_on:
      postgres:
        condition: service_healthy
  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PUBLIC_KEYS: "${CATALOG_SERVICE_JWT_PUBLIC_KEYS:-order-service-key-1=${ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64:?ORDER_SERVICE_JWT_PUBLIC_KEY_BASE64 must be set}}"
      SERVICE_JWT_KEY_OWNERS: "${CATALOG_SERVICE_JWT_KEY_OWNERS:-order-service-key-1=order-service}"
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${CATALOG_SERVICE_JWT_PRIVATE_KEY_BASE64:?CATALOG_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${CATALOG_SERVICE_JWT_KEY_ID:-catalog-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      EUREKA_URI: http://eureka-server:8761/eureka/
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DB_USERNAME: catalog_user
      CATALOG_DB_PASSWORD: catalog_password
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8083
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${ORDER_SERVICE_JWT_PRIVATE_KEY_BASE64:?ORDER_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${ORDER_SERVICE_JWT_KEY_ID:-order-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      EUREKA_URI: http://eureka-server:8761/eureka/
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      ORDER_DB_USERNAME: order_user
      ORDER_DB_PASSWORD: order_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      EUREKA_URI: http://eureka-server:8761/eureka/
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
      PAYMENT_DB_USERNAME: payment_user
      PAYMENT_DB_PASSWORD: payment_password
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET:?PAYMENT_CALLBACK_SECRET must be set}
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${PAYMENT_SERVICE_JWT_PRIVATE_KEY_BASE64:?PAYMENT_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${PAYMENT_SERVICE_JWT_KEY_ID:-payment-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8085
      EUREKA_URI: http://eureka-server:8761/eureka/
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification_db
      NOTIFICATION_DB_USERNAME: notification_user
      NOTIFICATION_DB_PASSWORD: notification_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
      SERVICE_JWT_PRIVATE_KEY_BASE64: ${NOTIFICATION_SERVICE_JWT_PRIVATE_KEY_BASE64:?NOTIFICATION_SERVICE_JWT_PRIVATE_KEY_BASE64 must be set}
      SERVICE_JWT_KEY_ID: ${NOTIFICATION_SERVICE_JWT_KEY_ID:-notification-service-key-1}
      IDENTITY_INTERNAL_URL: http://identity-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:?JWT_PUBLIC_KEY_BASE64 must be set}
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  kafka-data:
  redis-data:
  elasticsearch-data:
