spring:
  application:
    name: payment-service
  profiles:
    default: local
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_user}
    password: ${PAYMENT_DB_PASSWORD:payment_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${PAYMENT_KAFKA_GROUP_ID:payment-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    jwt:
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64}

server:
  port: 8084

app:
  service-jwt:
    private-key-base64: ${SERVICE_JWT_PRIVATE_KEY_BASE64}
    issuer: ${SERVICE_JWT_ISSUER:ecommerce-internal}
    key-id: ${SERVICE_JWT_KEY_ID:payment-service-key-1}
  active-account:
    identity-url: ${IDENTITY_INTERNAL_URL:http://localhost:8081}
  payment:
    callback-secret: ${PAYMENT_CALLBACK_SECRET:}
    callback-window-seconds: ${PAYMENT_CALLBACK_WINDOW_SECONDS:300}
  kafka:
    topics:
      order-events: ${ORDER_EVENTS_TOPIC:ecommerce.order.events}
      payment-events: ${PAYMENT_EVENTS_TOPIC:ecommerce.payment.events}
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
